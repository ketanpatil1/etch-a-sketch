<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Etch-A-Sketch</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="./style.css">
    </head>

    <body>
        <div class="sidebar flex-center">
            <div class="logo">
                Etch-A-Sketch!
            </div>
            <div class="input-container flex-center">
                <input type="number" min="1" max="64">x<input type="number" min="1" max="64"> cells
                <button type="button" id="refresh-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                    </svg>
                </button>
            </div>
            <label for="normal-btn" class="mode-btn">
                Normal Mode
                <input type="radio" name="mode" id="normal-btn" checked>
            </label>
            <label for="random-btn" class="mode-btn">
                Random Mode
                <input type="radio" name="mode" id="random-btn">
            </label>
            <label for="prog-dark-btn" class="mode-btn">
                Progressive Mode
                <input type="radio" name="mode" id="prog-dark-btn">
            </label>
        </div>
        <div class="content flex-center">
            <form class="theme-selector">
                <fieldset class="colors">
                    <label for="blue">Blue</label>
                    <input type="radio" name="theme" id="blue" checked>

                    <label for="red">Red</label>
                    <input type="radio" name="theme" id="red">

                    <label for="green">Green</label>
                    <input type="radio" name="theme" id="green">

                    <label for="yellow">Yellow</label>
                    <input type="radio" name="theme" id="yellow">

                    <label for="pink">Pink</label>
                    <input type="radio" name="theme" id="pink">

                    <label for="gray">Gray</label>
                    <input type="radio" name="theme" id="gray">
                </fieldset>

                <div class="separator"></div>

                <fieldset>
                    <label for="reverse">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" >
                            <path d="M12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8V16Z" fill="currentColor" />
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2ZM12 4V8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16V20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4Z" fill="currentColor" />

                        </svg>
                    </label>
                    <input type="checkbox" name="theme" id="reverse">
                </fieldset>
            </form>
            <div class="grid-container"></div>
        </div>
        <script src="./script.js"></script>
    </body>
</html>
